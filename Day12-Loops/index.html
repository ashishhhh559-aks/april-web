<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops-Index</title>
</head>
<body>
    <script>
        //++ Increment/increase the value by 1
        //-- Decrement/Decrease the value by 1

        //Task print no. from 1 to 10 in your console 
        
        //console.log(1)
        //console.log(2)
        //console.log(3)
        //.....
        //console.log(10)

        // 1. for loop
        //syntax: for(start point; ending/ condition point; ++ or --)

        // Task print no. 1 to 10 using for loop

       /* for(let i = 1 ; i <= 10 ; i++ )
         {

        // Body-task
        console.log(i)
         }
        
        for(let i = 1 ; i <= 10 ; i++ )
         {

        // Body-task
        console.log( "The value is", i)
         }*/

         //Print number 10 to 1 

         for(let i=10; i>=1; i--){
            console.log( "The number is ",i)
         }

         //2. While loop - Entry controlled loop 
         // Syntax- while (condition) {  }
         //When condition is True Loop will Start, when it becomes false is stopped

         let count = 1

         while(count<=5){
            console.log("Hello Guys")
            count++
         }

         // Do-while Loop- Exit controlled loop
         // it will run(execute) your code atleast 1 time, Even if your condition is false

         let number=45
         do{
            console.log("Hii it is do while loop")
         }while(number<5)

         



    </script>
</body>
</html>
