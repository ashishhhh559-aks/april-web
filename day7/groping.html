<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping selector</title>

    <style>
        /*Grouping */
        .A,#C,p{
            color: red;
        }
        body{
            background-color: aqua;
        }
    </style>

</head>
<body>
    <h2 class="A">Amazon</h2>
    <h3 id="C">CSS</h3>
    <p > Welcome to css</p>
    <div>Welcome to HTML</div>
</body>
</html>
