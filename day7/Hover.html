<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <style>

        div  {
            color: blue;
            background-color: aquamarine;
            height: 150px;
            width: 150px;   
            text-align: center;
        }
            div:Hover{
                background-color:greenyellow;
                transition: 3s;
            }
        
       div p{
            color: red;
        }
        p{
            color: green;
        }
        ul{
            color: chartreuse;
            list-style: none;
            
        }
        ul li{
            display: inline;
        }
        
            
    </style>
</head>
<body>
    <div>
        <h2>Ashish</h2>
        <p>Full Stack Developer</p>
    </div>
    <ul>
        <li>water</li>
        <li>Snacks</li>
        <li> mazza</li>
    </ul>
    <p>profile</p>
</body>
</html>
