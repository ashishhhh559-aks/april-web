<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class selector</title>
    <style>
        .A
        {
            color: red;
            text-justify: distribute;
        }
    </style>
</head>
<body>
    <h1 class="A">IPL</h1>
    <div class="A">football</div>
    <p class="A">tennis</p>
    <p>swimming</p>
</body>
</html>
