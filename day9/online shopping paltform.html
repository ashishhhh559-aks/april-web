<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxmodel</title>
    <style>
        body{
             font-family:Arial, Helvetica, sans-serif ;
             background-color: aqua;
             margin: 0;

        }
       .parent{
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
        gap:30px;
        }
        .product{
            border-radius: 10px;
            border: greenyellow solid;
            border-color: chartreuse;
            background-color: white;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            box-shadow: 8px 8px 12px black;
        }
                .product img{
            border-radius: 50%;
            object-fit: cover;
            height: 300px;
            width: 100%;
            border: 2px solid;
             border-color: chartreuse;
            box-shadow: 0 8px 12px black;

        }
        .product:hover{
            transform: scale(1.05);
            background-color: coral;
            
        }
        img:hover{
            transform: scale(1.05);
        }
        button{
            padding: 10px;
            border: 2px solid;
            border-color: aqua;
            border-radius: 15px;
            cursor: pointer;
            background-color:  red;
            color: whitesmoke;
        }
        button:hover{
            transform: scale(1.05);
            background-color: greenyellow;
            color: red;
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="product">
        <img  src="https://images.pexels.com/photos/34624326/pexels-photo-34624326.jpeg" >
        <h2>iphone17 Pro</h2>
        <p>$1200</p>
        <button>Buy now</button>
    </div>
    <div class="product" >
        <img src="https://images.pexels.com/photos/15632866/pexels-photo-15632866.jpeg" >
        <h2> Nike Shoe</h2>
        <p>$20</p>
        <button>Buy now</button>
    </div>
    <div class="product" >
        <img src="https://images.pexels.com/photos/1212842/pexels-photo-1212842.jpeg" >
        <h2>Hp laptop</h2>
        <p>$700</p>
        <button>Buy now</button>
    </div>
     <div class="product">
        <img  src="https://images.pexels.com/photos/5269699/pexels-photo-5269699.jpeg" >
        <h2>Headphone</h2>
        <p>$20</p>
        <button>Buy now</button>
    </div>
    <div class="product" >
        <img src="https://images.pexels.com/photos/35981347/pexels-photo-35981347.jpeg" >
        <h2> Cricket bat </h2>
        <p>$15.5</p>
        <button>Buy now</button>
    </div>
    <div class="product" >
        <img src="https://images.pexels.com/photos/11463472/pexels-photo-11463472.png" >
        <h2>School bag</h2>
        <p>$12</p>
        <button>Buy now</button>
    </div>
    </div>
</body>
</html>
