<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid1</title>
    <style>
        .product{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 5px;
            background-color: chartreuse;
        }
        .box{
            background-color: aquamarine;
            padding: 10px;
            border: 3px solid black;
            text-align: center;
            
            font-weight: bold;
        }
    </style>
</head>
<body>
     <div class="product">
    <div class="box">Cake</div>
    <div class="box">price</div>  
    <div class="box">Pastry</div>
        <div class="box">price</div>
    <div class="box">Cookies</div>  
    <div class="box">price</div>
    </div>
</body>
</html>
