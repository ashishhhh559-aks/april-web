<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex display</title>
    <style>
        .box{
            border: 3px solid red;
            height: 100px;
            width: 100px;
            margin: 7px;
            text-align: center;
            font-style: italic;
            font-weight: bold;
        }
        .product{
            background-color: aqua;
            display: flex;
            justify-content: center;
            height: 500px;
            align-items:center;
            gap: 30px;
             

        }
    </style>
</head>
<body>
    <div class="product">
    <div class="box">Cake</div>
    <div class="box">Cookies</div>  
    <div class="box">Pastry</div>
    </div>
</body>
</html>
