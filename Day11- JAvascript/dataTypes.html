    <script>
        //dataType- Types of data

        //1.string--> "anything between the double quotes or single quotes -text"

            var customername="john"
        
            //builtIn Methods are like features in programing language- we can use directly
            //typeof(Value)
        console.log(typeof(customername))

        //2.Number--> -ve, +ve, decimal no.

        var age=25
        console.log(typeof(age))

         var nutflex= false

        var b

        console.log(students)

        console.log(students[4])
