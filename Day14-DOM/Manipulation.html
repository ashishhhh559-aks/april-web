<body>
        <p id="text"> Hii Everyone</p>

        <butoon id="btn"> Login </butoon>

    <script>

        // Update text Content

        const ele = document.getElementById("text")
        
        ele.textContent= "Hello Everyone how are you?"

        //Inner HTML - Helps us to Update Tag or change the content of tag

        const ele2 = document.getElementById("myDiv")

        // ele2.inner HTML= "<h1> This is now Heading </h1>"

        ele2.innerHTML = " <p> Hello This is <mark> Update </mark>Tag </p> <em> Happy Weekend </em> <button> Smile </button> "

         const ele3 = document.getElementById("myid")

         ele3.style.color = "white"

         ele3.textContent=" Hii i am new stylish program "

    </script>
