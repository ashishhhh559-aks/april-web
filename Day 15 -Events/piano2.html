<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: sans-serif;
            text-align: center;
        }

        .piano{
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .key{
            border: 1px solid black;
            height: 200px;
            width: 60px;
            margin: 2px;
            background-color: white;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .key:active{
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <h1>This is online Piano</h1>

    <div class="piano">
    
        <div class="key" data-note="A">Sa</div>
        <div  style="background-color: black;" class="key"  data-note="B">Re</div>
        <div class="key" data-note="C">Ga</div>
        <div style="background-color: black;" class="key" data-note="D">Ma</div>
        <div class="key" data-note="E">P</div>
        <div style="background-color: black;" class="key" data-note="F">Dh</div>
        <div class="key" data-note="G">Ni</div>

    </div>

    <audio id="audio-A" src="./11325622-wind-up-tone-effect-240240.mp3"  ></audio>
    <audio id="audio-B" src="./freesound_community-generic-censor-tone-104518.mp3"  ></audio>
    <audio id="audio-C" src="./freesound_community-harmonium-13610hz-47942.mp3"  ></audio>
    <audio id="audio-D" src="./freesound_community-harmonium-c3-96340.mp3"  ></audio>
    <audio id="audio-E" src="./senthilkumarnew-soft-ring-tone-313009.mp3"  ></audio>
    <audio id="audio-F" src="./soundreality-kitchen-tone-450982 (2).mp3"  ></audio>
    <audio id="audio-G" src="./subhamita-harmonium-sound-effect-01-320842 (1).mp3"  ></audio>
    


     
     <script>
            const keys = document.querySelectorAll(".key")
            console.log(keys)

            //Keys will be an array bcz it is storing Multiple div container

            keys.forEach( function(e){

            const note =  e.getAttribute("data-note")

            const audio = document.getElementById("audio-"+note)

             e.addEventListener('click',function(){
                audio.currentTime = 0;
                audio.repeat=1;
                audio.play()
             })    

              e.addEventListener('mouseout',function(){
                audio.currentTime= 0;
                audio.off()
              })
             
              //Mouse

               e.addEventListener('mouseover',function(){
                e.style.backgroundColor ="lightblue"
            })


              e.addEventListener('mouseout',function(){
                e.style.backgroundColor ="white"
            
            })

            })

             
           
          


     </script>
</body>
</html>
