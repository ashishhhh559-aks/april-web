<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonBox</title>
     <style>
        .box{
            background-color: yellow;
            height: 200px;
            width: 200px;
            border: 5px solid red;
            animation: glowbox 1.5s infinite alternate;
        }
        @keyframes glowbox{
            from{
                box-shadow: 0 0 5px red, 0 0 10px red;
            }
        to{
            box-shadow: 0 0 20px green, 0 0 40px green;
        }
        }
     </style>
</head>
<body>
    <div class="box">

    </div>
</body>
</html>
