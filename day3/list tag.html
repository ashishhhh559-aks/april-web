<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list tag </title>
</head>
<body>
    <ol>
        <li>pizza</li>
        <li>pasta</li>
        <li>dessert</li>
        <li>beverages</li>
    </ol>
    <ul>
        <li>pizza</li>
        <li>pasta</li>
        <li>dessert</li>
        <li>beverages</li>
    </ul>

     <ol type="A">
        <li>pizza</li>
        <li>pasta</li>
        <li>dessert</li>
        <li>beverages</li>
    </ol>

     <ul type="square">
        <li>pizza</li>
        <li>pasta</li>
        <li>dessert</li>
        <li>beverages</li>
    </ul>

     <ul type=" circle">
        <li>pizza</li>
        <li>pasta</li>
        <li>dessert</li>
        <li>beverages</li>
    </ul>
</body>
</html>
